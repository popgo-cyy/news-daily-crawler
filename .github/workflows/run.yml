name: 每日资讯抓取
on:
  schedule:
    # cron 是UTC时间！北京时间 = UTC+8
    # 下面：UTC 0点 = 北京时间早上8点，你可以自己改
    - cron: '0 0 * * *'
  workflow_dispatch: # 增加这个：支持手动点击立即运行测试

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 执行爬虫
        run: python crawler.py
      - name: 提交历史记录（持久化去重记录）
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add history.txt
          git commit -m "update history" || echo "无更新"
          git push
